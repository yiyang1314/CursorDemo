name: CursorWpf CI and Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content Build/version.txt -Raw).Trim().Trim([char]0xFEFF)
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = "${{ steps.version.outputs.version }}"
          if ($tag -ne "v$v") { throw "Tag '$tag' does not match Build/version.txt (v$v). Update Build/version.txt before tagging." }
      - name: Build Release
        run: msbuild CursorWpf.sln /m /t:Clean,Build /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
      - name: Stage publish folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Publish | Out-Null
          Copy-Item CursorWpf.App/bin/Release/CursorWpf.exe Publish/
          if (Test-Path CursorWpf.App/bin/Release/CursorWpf.exe.config) { Copy-Item CursorWpf.App/bin/Release/CursorWpf.exe.config Publish/ }
          Copy-Item Docs Publish/Docs -Recurse
          Copy-Item README.md Publish/
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path Publish/* -DestinationPath "CursorWpf_V${{ steps.version.outputs.version }}.zip" -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorWpf_V${{ steps.version.outputs.version }}
          path: CursorWpf_V${{ steps.version.outputs.version }}.zip
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --yes --no-progress
      - name: Build EXE installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" Installer/CursorWpf.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CursorWpf_V${{ steps.version.outputs.version }}
          files: |
            CursorWpf_V${{ steps.version.outputs.version }}.zip
            Release/CursorWpf_V${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
